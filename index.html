<html lang="en"><head><meta charset="utf-8">

<meta property="og:title" content="Imanuel M.T. Manullang – Penetration Tester Portfolio"><meta property="og:description" content="Interactive 3D monitor-wall portfolio of Imanuel M.T. Manullang."><meta property="og:type" content="website">
<link rel="icon" type="image/png" href="images/logo.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style id="theme-style">
:root{
  --persp:1700px;--cam:12;--g:.22;
  --bg:#090708;--bg-top:#1d1115;
  --ac:#c81e32;--ac-hov:#dc2638;--ac2:#fb7185;--glow-rgb:200,30,50;
  --tx:#f6eff0;--mu:#b8a3a7;--pn:#120e10;--pn2:#1b1316;
  --cd:#1a1215;--bd:#312025;--tag-bg:#2e151c;--tag-tx:#fecdd3;
  --btn-g:#261a1e;--btn-gt:#f3dce0;--tl-bd:#3a2229;--term-bg:#0b0809;--term-tx:#f2d5da;
  --sh-top:rgba(255,255,255,.06);--sh-vig:rgba(0,0,0,.38)
}
body.screen-light{
  --tx:#1c1214;--mu:#664f54;--pn:#faf5f6;--pn2:#f2e8ea;
  --cd:#ffffff;--bd:#e5d4d8;--tag-bg:#ffe4e8;--tag-tx:#9f1239;
  --ac2:#be123c;--btn-g:#ece0e3;--btn-gt:#2e181d;--tl-bd:#dfc8cd;--term-bg:#161012;--term-tx:#f5dce0;
  --sh-top:rgba(255,255,255,.45);--sh-vig:rgba(40,15,22,.08)
}
</style>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:13px/1.48 Inter,system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
body.stack{overflow:auto}

/* ===== NIGHT STUDIO ROOM ENVIRONMENT (Always Night Mode, Strictly Behind Monitors) ===== */
.stage{position:fixed;inset:0;z-index:2;overflow:hidden;background:radial-gradient(85% 68% at 50% 38%,var(--bg-top),var(--bg) 74%)}
body.focus .stage{z-index:45}
.room-lamp{position:absolute;top:0;left:50%;transform:translateX(-50%);width:clamp(260px,24vw,380px);height:5px;background:linear-gradient(90deg,transparent,var(--ac2) 20%,#fff 50%,var(--ac2) 80%,transparent);border-radius:0 0 8px 8px;box-shadow:0 2px 18px rgba(var(--glow-rgb),.7),0 6px 45px rgba(var(--glow-rgb),.45);z-index:0;pointer-events:none;transition:opacity .5s}
.room-cone{position:absolute;inset:0;background:radial-gradient(48% 55% at 50% 0%,rgba(var(--glow-rgb),.14),transparent 72%);z-index:0;pointer-events:none;transition:opacity .5s}
.room-ambient{position:absolute;inset:0;pointer-events:none;z-index:0;background:radial-gradient(2px 2px at 22% 28%,rgba(var(--glow-rgb),.32),transparent),radial-gradient(1.5px 1.5px at 38% 18%,rgba(var(--glow-rgb),.24),transparent),radial-gradient(2px 2px at 64% 24%,rgba(var(--glow-rgb),.28),transparent),radial-gradient(1.5px 1.5px at 77% 34%,rgba(var(--glow-rgb),.2),transparent);transition:opacity .5s}

/* ===== 3D WORLD & MONITOR ARMS (Stands strictly behind all monitors) ===== */
.arms{position:absolute;inset:0;perspective:var(--persp);perspective-origin:50% 54%;pointer-events:none;z-index:1}
.arm-holder{position:absolute;left:50%;top:54%;margin-left:calc(var(--w)*-.5px);margin-top:calc(var(--h)*-.5px);width:calc(var(--w)*1px);height:calc(var(--h)*1px);transition:transform 1.35s cubic-bezier(.22,1,.32,1)}
.arm{position:absolute;left:50%;bottom:-32px;width:12px;height:40px;margin-left:-6px;background:linear-gradient(90deg,#141112,#2e2528,#141112);border-radius:3px;box-shadow:0 6px 14px rgba(0,0,0,.6)}
body.focus .arms{opacity:.15;transition:opacity .5s}

.world{position:absolute;inset:0;perspective:var(--persp);perspective-origin:50% 54%;transform-style:flat;z-index:2}
.bgp{position:absolute;left:50%;top:54%;pointer-events:none;z-index:0}

/* ===== MONITORS & SLOWER SMOOTH HOVER/FOCUS ANIMATION ===== */
.mon{position:absolute;left:50%;top:54%;margin-left:calc(var(--w)*-.5px);margin-top:calc(var(--h)*-.5px);width:calc(var(--w)*1px);height:calc(var(--h)*1px);transform-style:preserve-3d;transition:transform 1.35s cubic-bezier(.22,1,.32,1);outline:0;cursor:pointer;z-index:var(--zi,2)}
body:not(.focus) .mon:hover,body:not(.focus) .mon:focus-visible{--g:.48;z-index:25!important}
body.focus .mon:not(.focus){--g:.04;pointer-events:none}
.mon.focus{--g:.52;cursor:default;z-index:50!important;transform-style:flat;transition:transform 1.1s cubic-bezier(.22,1,.32,1)}
.mon.focus .rotor{transform-style:flat}

.glow{position:absolute;inset:-28px;border-radius:36px;background:radial-gradient(closest-side,rgba(var(--glow-rgb),var(--g)),rgba(var(--glow-rgb),0) 78%);transform:translateZ(-10px);transition:opacity .5s;pointer-events:none}
.mon.focus .glow{display:none}
.ring{position:absolute;inset:-4px;border:2px solid var(--ac2);border-radius:15px;opacity:0;transform:translateZ(50px);pointer-events:none;z-index:12}
.mon:focus-visible .ring{opacity:1}

.rotor{position:absolute;inset:0;transform-style:preserve-3d}
.fr{position:absolute;inset:0;border-radius:12px;padding:6px 6px 16px;background:linear-gradient(145deg,#2e2528,#171315);box-shadow:inset 0 0 0 1px #423337,0 16px 38px rgba(0,0,0,.6)}
.led{position:absolute;right:16px;bottom:6px;width:4px;height:4px;border-radius:50%;background:var(--ac);box-shadow:0 0 6px var(--ac)}
.panel{position:relative;width:100%;height:100%;border-radius:6px;overflow:hidden;background:radial-gradient(120% 100% at 20% 0,var(--pn2),var(--pn) 62%);color:var(--tx);padding:15px 17px;transition:background .3s,color .3s}
.sheen{position:absolute;inset:0;pointer-events:none;background:linear-gradient(115deg,var(--sh-top),transparent 36%),radial-gradient(130% 130% at 50% 50%,transparent 68%,var(--sh-vig))}
.dim{position:absolute;inset:0;background:rgba(7,5,6,.8);opacity:0;pointer-events:none;transition:opacity .5s;border-radius:12px;z-index:9}
body.focus .mon:not(.focus) .dim{opacity:1}

/* ===== 3D CURVED STRIPS (Top 3 Monitors) + LIVE INTERACTION ===== */
.strips{position:absolute;left:50%;top:0;width:0;height:0;transform-style:preserve-3d;pointer-events:none;transition:opacity .3s}
.st{position:absolute;top:0;overflow:hidden;backface-visibility:hidden}
.mon.curved:not(.focus):not(.rot-anim) .rotor>.fr{opacity:0;transform:translateZ(18px);pointer-events:auto}
.mon:not(.curved) .strips,.mon.focus .strips,.mon.rot-anim .strips{display:none}

.rotctl{position:absolute;right:34px;bottom:-1px;width:26px;height:16px;border:0;border-radius:4px;background:#261e21;color:var(--ac2);font-size:12px;line-height:1;cursor:pointer;transform:translateZ(35px);z-index:10}
.mon.focus .rotctl{transform:none}
.rotctl:hover,.rotctl:focus-visible{background:var(--ac);color:#fff;outline:0}
.handle{position:absolute;right:-8px;bottom:-8px;width:22px;height:22px;border-radius:50%;border:2px solid var(--ac2);opacity:0;cursor:grab;transform:translateZ(35px);touch-action:none;transition:opacity .2s;z-index:10}
.mon.focus .handle{transform:none}
.mon:hover .handle{opacity:.7}

/* ===== UI INSIDE SCREENS ===== */
h1,h2,h3{font-family:'Space Grotesk',sans-serif;margin:0;color:var(--tx)}
.ph{display:flex;justify-content:space-between;align-items:center;color:var(--mu);font-size:10px;font-weight:600;letter-spacing:.15em;text-transform:uppercase;margin-bottom:8px}
.ph b{color:var(--ac2);font-family:'JetBrains Mono',monospace;font-weight:500}
.ph-right{display:flex;align-items:center;gap:6px}
.tbtn{font:600 9.5px 'JetBrains Mono',monospace;color:var(--tx);background:var(--btn-g);border:1px solid var(--bd);border-radius:6px;padding:2px 7px;cursor:pointer;letter-spacing:.04em;transition:background .2s,border-color .2s}
.tbtn:hover{background:var(--ac);color:#fff;border-color:var(--ac)}
p{margin:5px 0}.mu{color:var(--mu)}
.tag{font:500 10px 'JetBrains Mono',monospace;font-style:normal;padding:2px 7px;border-radius:99px;background:var(--tag-bg);color:var(--tag-tx);margin:2px 4px 2px 0;display:inline-block}
.btn,.ar{font:500 11.5px Inter;color:#fff;background:var(--ac);border:0;border-radius:7px;padding:5px 10px;margin:4px 5px 0 0;text-decoration:none;display:inline-block;cursor:pointer;transition:background .2s,transform .15s}
.btn:hover,.ar:hover{background:var(--ac-hov);transform:translateY(-1px)}
.btn.g{background:var(--btn-g);color:var(--btn-gt);border:1px solid var(--bd)}
.btn.g:hover{background:var(--ac);color:#fff;border-color:var(--ac)}

/* Main Monitor (Profile) */
.pg{display:grid;grid-template-columns:auto 1fr auto;gap:18px;align-items:center;height:calc(100% - 26px)}
.av{width:88px;height:88px;border-radius:50%;display:grid;place-items:center;font:700 30px 'Space Grotesk';color:#fff;background:linear-gradient(135deg,var(--ac),#2a0810);box-shadow:0 0 0 4px var(--bd)}
.pg h1{font-size:27px;line-height:1.12}
.role{color:var(--ac2);font-weight:600;font-size:12.5px;margin:3px 0 6px}
.sum{font-size:12px;line-height:1.45}
.facts{list-style:none;margin:0;padding:0;display:grid;gap:7px;min-width:118px}
.facts li{background:var(--cd);border:1px solid var(--bd);border-radius:9px;padding:7px 12px;color:var(--mu);font-size:10.5px}
.facts b{display:block;font:700 18px 'Space Grotesk';color:var(--tx)}
.portrait .pg{grid-template-columns:1fr;justify-items:center;text-align:center;align-content:start;gap:10px;padding-top:4px}
.portrait .facts{grid-template-columns:repeat(3,1fr);width:100%}
.portrait .pg h1{font-size:24px}

/* Projects Carousel & Real Screenshots */
.car{display:flex;flex-direction:column;height:calc(100% - 26px)}
.vp{flex:1;min-height:0;overflow:hidden;border-radius:9px;touch-action:pan-y}
.track{display:flex;height:100%;transition:transform .6s cubic-bezier(.3,.8,.3,1)}
.slide{flex:0 0 100%;display:grid;grid-template-rows:1fr auto;gap:7px;cursor:pointer}
.th{position:relative;border-radius:9px;overflow:hidden;display:grid;place-items:center;font:700 54px 'Space Grotesk';color:rgba(255,255,255,.3);background:#1a1114;border:1px solid var(--bd)}
.th img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.th-badge{position:absolute;left:8px;top:8px;padding:2px 8px;border-radius:6px;background:rgba(15,10,12,.82);color:var(--ac2);font:500 10px 'JetBrains Mono',monospace;backdrop-filter:blur(4px)}
.sb h3{font-size:15.5px;line-height:1.2}.sb p{color:var(--mu);font-size:11.5px;margin:2px 0 4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.nav{display:flex;justify-content:space-between;align-items:center;padding-top:6px}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--bd);margin:0 3px;cursor:pointer;transition:.2s}
.dot.on{background:var(--ac2);transform:scale(1.2)}
.ar{padding:2px 11px;margin:0;font-size:16px}
.detail{display:none;height:calc(100% - 26px);overflow:auto;padding-right:4px}
.mon.detail .car{display:none}.mon.detail .detail{display:block}
.shots{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:10px 0}
.shots img{width:100%;aspect-ratio:16/10;object-fit:cover;object-position:top;border-radius:8px;border:1px solid var(--bd)}

/* Timeline & Scrollable Panels */
.scroll{overflow:auto;height:calc(100% - 26px);padding-right:6px;scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
.scroll::-webkit-scrollbar{width:6px}.scroll::-webkit-scrollbar-thumb{background:var(--ac);border-radius:9px}
.tl{border-left:2px solid var(--tl-bd);margin-left:5px;padding-left:14px}
.tl>div{position:relative;margin-bottom:12px}
.tl>div:before{content:'';position:absolute;left:-20px;top:4px;width:9px;height:9px;border-radius:50%;background:var(--ac);box-shadow:0 0 0 3px var(--pn)}
.tl h3{font-size:13px;line-height:1.25}.tl small{color:var(--ac2);font-weight:500;font-size:11px}.tl p{color:var(--mu);font-size:11.5px;margin:3px 0}

/* Cards (Certs, Achievements, Community) */
.cards{display:grid;grid-template-columns:1fr 1fr;gap:7px;height:calc(100% - 26px);overflow:auto;padding-right:4px;scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
.card{background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:8px 10px}
.card h3{font-size:12px;line-height:1.25}.card small{color:var(--ac2);font-size:10.5px;font-weight:500}.card p{font-size:11px;margin:3px 0 0}
.card a{color:var(--ac2);font-size:10.5px;font-weight:500;text-decoration:underline}

/* Skills & Terminal */
.term{font:11.5px 'JetBrains Mono',monospace;background:var(--term-bg);border:1px solid var(--bd);border-radius:8px;padding:7px 9px;height:calc(100% - 74px);display:flex;flex-direction:column;cursor:text}
.tout{flex:1;overflow:auto;color:var(--term-tx);scrollbar-width:none}.tout div{white-space:pre-wrap;margin-bottom:2px}.tout u{color:var(--ac2)}
.ti{display:flex;gap:6px;color:var(--ac2)}.ti input{flex:1;background:none;border:0;color:#fff;font:inherit;outline:0}
.chips{display:flex;flex-wrap:wrap;margin-bottom:6px}
.chips .tag{font-size:10.5px;padding:2px 8px;transition:.2s;cursor:pointer}.chips .tag:hover{transform:translateY(-2px);background:var(--ac);color:#fff}

.close{position:fixed;top:18px;right:18px;z-index:60;display:none;background:#1f1417;color:#f6eff0;border:1px solid var(--bd);border-radius:9px;padding:8px 14px;font:500 13px Inter;cursor:pointer}
body.focus .close{display:block}.close:hover,.close:focus-visible{background:var(--ac);outline:0}
.hint{position:fixed;top:14px;left:0;right:0;text-align:center;color:#9e8489;font-size:11px;letter-spacing:.06em;z-index:5;pointer-events:none}

/* ===== CENTER PERSON & DESK (No arch highlight, no line over monitors, behind focus preview) ===== */
.me{position:fixed;left:50%;bottom:-1vh;transform:translateX(-50%);width:clamp(225px,26vw,396px);z-index:30;pointer-events:none;transition:opacity .5s}
.desk{position:fixed;left:0;right:0;bottom:0;height:16vh;z-index:1;pointer-events:none;background:linear-gradient(to bottom,transparent 0%,#070506 90%);transition:opacity .5s}
.haze{position:fixed;inset:0;z-index:1;pointer-events:none;transition:opacity .5s;background:radial-gradient(75% 65% at 50% 46%,transparent 60%,rgba(6,4,5,.65))}
body.focus .world{z-index:45}
body.focus .me{z-index:1;opacity:.12}
body.focus .haze,body.focus .desk,body.focus .room-lamp,body.focus .room-cone,body.focus .room-ambient{opacity:.14}

/* mobile / tablet stack */
.stack .stage{position:relative;perspective:none;overflow:visible;padding:44px 14px 30px;min-height:100%}
.stack .world{position:static;perspective:none;transform:none;width:auto;height:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:20px;max-width:1000px;margin:auto}
.stack .world>.mon.main{grid-column:1/-1}
.stack .mon{position:relative;left:auto;top:auto;margin:0;width:100%;height:auto;transform:perspective(900px) rotateX(5deg)!important}
.stack .rotor,.stack .fr{position:relative;inset:auto;opacity:1!important;transform:none!important}.stack .panel{height:auto;min-height:230px}.stack .scroll,.stack .term,.stack .cards{height:260px}.stack .car{height:320px}
.stack .glow,.stack .arms,.stack .strips,.stack .dim,.stack .ring,.stack .bgp,.stack .me,.stack .desk,.stack .spot,.stack .room-lamp,.stack .room-cone,.stack .handle{display:none}
.stack .rotctl{bottom:2px;width:44px;height:30px;right:30px}
.stack .pg{grid-template-columns:1fr;justify-items:center;text-align:center;height:auto}.stack .hint{position:absolute}
@media(prefers-reduced-motion:reduce){.mon,.arm-holder,.spot,.track{transition:opacity .2s!important}}
</style></head><body>

<script>
/* ===== THEME STORAGE & DEFAULT CONFIG ===== */
const DEFAULT_THEME={
  dark:{
    '--bg':'#090708','--bg-top':'#1d1115',
    '--ac':'#c81e32','--ac-hov':'#dc2638','--ac2':'#fb7185','--glow-rgb':'200,30,50',
    '--tx':'#f6eff0','--mu':'#b8a3a7','--pn':'#120e10','--pn2':'#1b1316',
    '--cd':'#1a1215','--bd':'#312025','--tag-bg':'#2e151c','--tag-tx':'#fecdd3',
    '--btn-g':'#261a1e','--btn-gt':'#f3dce0','--tl-bd':'#3a2229','--term-bg':'#0b0809','--term-tx':'#f2d5da'
  },
  light:{
    '--tx':'#1c1214','--mu':'#664f54','--pn':'#faf5f6','--pn2':'#f2e8ea',
    '--cd':'#ffffff','--bd':'#e5d4d8','--tag-bg':'#ffe4e8','--tag-tx':'#9f1239',
    '--ac2':'#be123c','--btn-g':'#ece0e3','--btn-gt':'#2e181d','--tl-bd':'#dfc8cd','--term-bg':'#161012','--term-tx':'#f5dce0'
  }
};
let THEME=JSON.parse(JSON.stringify(DEFAULT_THEME));
try{
  const saved=localStorage.getItem('im_portfolio_theme_v1');
  if(saved){const parsed=JSON.parse(saved);if(parsed&&parsed.dark&&parsed.light)THEME=parsed}
}catch(e){}

function hexToRgbStr(hex){
  const m=/^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex||'');
  return m?`${parseInt(m[1],16)},${parseInt(m[2],16)},${parseInt(m[3],16)}`:'200,30,50';
}
function buildThemeCss(t){
  t.dark['--glow-rgb']=hexToRgbStr(t.dark['--ac']);
  const dVars=Object.entries(t.dark).map(([k,v])=>`${k}:${v}`).join(';');
  const lVars=Object.entries(t.light).map(([k,v])=>`${k}:${v}`).join(';');
  return `:root{--persp:1700px;--cam:12;--g:.22;${dVars};--sh-top:rgba(255,255,255,.06);--sh-vig:rgba(0,0,0,.38)}\nbody.screen-light{${lVars};--sh-top:rgba(255,255,255,.45);--sh-vig:rgba(40,15,22,.08)}`;
}
function applyTheme(t,rebuildStrips=false){
  const el=document.getElementById('theme-style');
  if(el)el.textContent=buildThemeCss(t);
  const wg=document.getElementById('wg');
  if(wg)wg.style.background=`radial-gradient(55% 50% at 50% 50%,rgba(${t.dark['--glow-rgb']},.22),transparent 70%)`;
  if(rebuildStrips&&typeof renderAll==='function')renderAll();
}
applyTheme(THEME,false);

/* ===== BILINGUAL CV & PORTFOLIO DATA (Imanuel M.T. Manullang) ===== */
const ASSET_PREFIX=window.__ASSET_PREFIX||'';
const I18N={
  en:{
    hint:'Click a monitor to preview · Esc to close · Rotate main screen with chin button',
    close:'Close ✕',
    based:'Based in',
    dlCv:'⬇ Download CV',
    viewCred:'View credential ↗',
    liveDemo:'Live / Report ↗',
    repo:'GitHub Repo ↗',
    back:'‹ Back',
    termInit:'type <u>help</u> to begin (try: whoami, skills, edu, contact)',
    names:{main:'Profile',projects:'Projects',exp:'Work Experience',certs:'Certifications & Training',ach:'Achievements',interests:'Skills & Terminal',community:'Leadership & Education'},
    profile:{
      name:'Imanuel M.T. Manullang',ini:'IM',
      role:'Penetration Tester · Backend & Security Engineer',
      sum:'Information Technology student at Universitas Sumatera Utara (GPA 3.85/4.00) focused on web application security, vulnerability assessment, and secure backend engineering. Certified in Google Cybersecurity & Cisco Ethical Hacker.',
      loc:'Medan, Indonesia · imanuelmtm@gmail.com',
      facts:[['3.85','GPA / 4.00 at USU'],['6+','Security & Web Projects'],['6','Security Certifications']]

/* Build 3D curved strips + sync live panel events */
function build(id){
  const m=mons[id],ah=arms[id],[w,h]=dim(id),host=m.querySelector('.strips');
  host.innerHTML='';
  m.style.setProperty('--w',w);m.style.setProperty('--h',h);
  ah.style.setProperty('--w',w);ah.style.setProperty('--h',h);
  if(!SZ[id][2]||stack)return;
  const N=id=='main'&&portrait?10:SZ[id][3],W=w,Hh=h,sw=W/N,Rr=CFG.curveR,fr=m.querySelector('.rotor>.fr');
  for(let i=0;i<N;i++){
    const xc=(i+.5)*sw-W/2,t=xc/Rr,s=document.createElement('div');s.className='st';
    s.style.cssText=`width:${sw+1.2}px;height:${Hh}px;left:${-sw/2}px;transform:translate3d(${(Rr*Math.sin(t)).toFixed(2)}px,0,${(Rr*(1-Math.cos(t))).toFixed(2)}px) rotateY(${(-t*180/Math.PI).toFixed(2)}deg);`+(i==0?'border-radius:12px 0 0 12px':i==N-1?'border-radius:0 12px 12px 0':'');
    const f=fr.cloneNode(true);
    f.style.cssText=`position:absolute;top:0;left:${-i*sw}px;width:${W}px;height:${Hh}px;opacity:1;transform:none;pointer-events:none`;
    s.append(f);host.append(s);
  }
}

function wirePanel(id){

    },{passive:true});
  }
  if(id==='main'){
    live.querySelectorAll('.tbtn').forEach(b=>b.onclick=e=>{
      e.stopPropagation();
      if(b.dataset.act==='theme'){
        lightMode=!lightMode;

        renderAll();

    const n=L().projects.length;
    const go=k=>{
      projIdx=(k+n)%n;
      m.querySelectorAll('.car').forEach(c=>{
        c.querySelector('.track').style.transform=`translateX(${-projIdx*100}%)`;
        c.querySelectorAll('.dot').forEach((d,j)=>d.classList.toggle('on',j===projIdx));
      });
    };
    go(projIdx);
    live.querySelectorAll('.ar').forEach(b=>b.onclick=e=>{e.stopPropagation();projStarted=true;go(projIdx+ +b.dataset.d)});

    const vp=live.querySelector('.vp');let sx=null;
    vp.onpointerdown=e=>sx=e.clientX;

function renderAll(){
  for(const id in SZ){
    const m=mons[id];
    m.setAttribute('aria-label',L().names[id]+' monitor. Press Enter to focus.');
    m.querySelector('.rotor>.fr>.panel').innerHTML=R[id]();
    build(id);
    wirePanel(id);
  }
  place();
}

function baseT(id,lift=0){
  const s=sc(),[a,y]=LAY[portrait?'port':'land'][id],r=a*Math.PI/180,x=CFG.arc*Math.sin(r)*s,yv=y*s,z=(CFG.arc*(1-Math.cos(r))+lift)*s,k=s*(lift?1.04:1);
  return`rotateX(${CFG.cam}deg) translate3d(${x.toFixed(1)}px,${yv.toFixed(1)}px,${z.toFixed(1)}px) rotateY(${-a}deg) rotateX(${-CFG.cam*.5}deg) scale(${k.toFixed(4)})`;
}

function focusT(id,big){
  const [w,h]=dim(id),y=Math.round(innerHeight*(.5-.54));
  const isPortMain=(id==='main'&&portrait);
  const wRatio=big?.82:isPortMain?.85:.72;
  const hRatio=big?.82:isPortMain?.88:.70;
  const k=Math.min(innerWidth*wRatio/w,innerHeight*hRatio/h);
  return`translate(0px,${y}px) scale(${k.toFixed(4)})`;
}

function place(){
  const s=sc();
  for(const id in SZ){
    const m=mons[id],ah=arms[id];
    if(stack){m.style.transform='';ah.style.transform='';continue}
    ah.style.transform=baseT(id,0);
    if(cur===id){m.style.transform=focusT(id,m.classList.contains('detail'));continue}
    m.style.transform=baseT(id,hov===id&&!cur?48:0);
  }
  $('#wg').style.transform=`rotateX(${CFG.cam}deg) translate3d(0,${-30*s}px,${-130*s}px) scale(${s})`;
}

function open(id){cur=id;hov=null;document.body.classList.remove('main-hov');document.body.classList.add('focus');for(const k in mons)mons[k].classList.toggle('focus',k===id);place();mons[id].focus({preventScroll:true})}
function close(){const m=cur&&mons[cur];cur=null;document.body.classList.remove('focus');for(const k in mons)mons[k].classList.remove('focus','detail');place();if(m)m.focus({preventScroll:true})}
$('#close').onclick=close;
$('#stage').addEventListener('click',e=>{if(cur&&!e.target.closest('.mon'))close()});
addEventListener('keydown',e=>{if(e.key==='Escape'&&cur){if(mons[cur].classList.contains('detail')){mons[cur].classList.remove('detail');place()}else close()}});

/* Main monitor rotation */
function rotate(){
  if(busy)return;busy=true;
  const m=mons.main,rot=m.querySelector('.rotor'),to=!portrait,fromDeg=to?90:-90;
  portrait=to;m.classList.toggle('portrait',to);
  if(stack||RM){build('main');place();if(stack&&!RM)rot.animate([{transform:'perspective(800px) rotateY(0)'},{transform:'perspective(800px) rotateY(360deg)'}],{duration:700,easing:'ease-in-out'});busy=false;return}
  m.classList.add('rot-anim');
  m.style.setProperty('--w',dim('main')[0]);m.style.setProperty('--h',dim('main')[1]);
  arms.main.style.setProperty('--w',dim('main')[0]);arms.main.style.setProperty('--h',dim('main')[1]);
  place();
  const a=rot.animate([{transform:`rotateZ(${fromDeg}deg) scale(.92)`},{transform:'rotateZ(0deg) scale(1)'}],{duration:CFG.rotMs,easing:'cubic-bezier(.22,1,.32,1)'});
  a.onfinish=()=>{build('main');m.classList.remove('rot-anim');busy=false};
}
mons.main.querySelector('.rotctl').onclick=e=>{e.stopPropagation();rotate()};
{const hd=mons.main.querySelector('.handle');let x0,y0;hd.onpointerdown=e=>{x0=e.clientX;y0=e.clientY;hd.setPointerCapture(e.pointerId);e.stopPropagation()};hd.onpointerup=e=>{if(Math.hypot(e.clientX-x0,e.clientY-y0)>28)rotate()}}

    const a=document.createElement('a');
    a.href=URL.createObjectURL(blob);
    a.download='index.html';
    a.click();
    msgEl.textContent='⬇ File index.html baru berhasil diunduh!';
  };
  let min=false;
  st.querySelector('#st-min').onclick=e=>{
    min=!min;
    st.querySelector('#st-body').style.display=min?'none':'flex';
    e.target.textContent=min?'+':'_';
  };
}
</script></body></html>
